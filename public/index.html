<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AnonChat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
    body { background: #111; color: #fff; display: flex; flex-direction: column; height: 100dvh; }
    header { padding: 14px 18px; background: #1c1c1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2c2c2e; }
    #status { font-size: 13px; color: #8e8e93; font-weight: 500; }
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4; word-break: break-word; }
    .me { align-self: flex-end; background: #0a84ff; color: #fff; border-bottom-right-radius: 4px; }
    .stranger { align-self: flex-start; background: #2c2c2e; color: #fff; border-bottom-left-radius: 4px; }
    .system { align-self: center; font-size: 12px; color: #636366; }
    footer { display: flex; gap: 8px; padding: 10px 14px; background: #1c1c1e; border-top: 1px solid #2c2c2e; }
    input { flex: 1; padding: 12px 16px; border-radius: 20px; border: none; background: #2c2c2e; color: #fff; font-size: 15px; outline: none; }
    button { padding: 10px 18px; border-radius: 20px; border: none; font-weight: 600; cursor: pointer; }
    #send-btn { background: #0a84ff; color: #fff; }
    #next-btn { background: #ff453a; color: #fff; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div style="font-weight:700; font-size:17px;">AnonChat</div>
    <div id="status">Tap Find</div>
    <button id="next-btn" onclick="nextChat()">Find</button>
  </header>
  <div id="chat-box"></div>
  <footer>
    <input id="input" type="text" placeholder="Message..." disabled autocomplete="off" />
    <button id="send-btn" onclick="sendMsg()" disabled>Send</button>
  </footer>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const chatBox = document.getElementById('chat-box');
    const input = document.getElementById('input');
    const statusText = document.getElementById('status');
    const nextBtn = document.getElementById('next-btn');
    const sendBtn = document.getElementById('send-btn');
    let connected = false;

    function addMessage(text, type) {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function nextChat() {
      chatBox.innerHTML = '';
      socket.emit('leave_chat');
      socket.emit('find_partner');
      statusText.textContent = 'Searching...';
      nextBtn.textContent = 'Skip';
      input.disabled = true;
      sendBtn.disabled = true;
      connected = false;
    }

    function sendMsg() {
      const text = input.value.trim();
      if (!text || !connected) return;
      socket.emit('send_message', text);
      addMessage(text, 'me');
      input.value = '';
    }

    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMsg(); });
    socket.on('status', (msg) => { statusText.textContent = msg; });
    socket.on('chat_start', (msg) => {
      connected = true;
      statusText.textContent = 'Connected';
      input.disabled = false;
      sendBtn.disabled = false;
      addMessage(msg, 'system');
      input.focus();
    });
    socket.on('receive_message', (text) => addMessage(text, 'stranger'));
    socket.on('partner_left', (msg) => {
      connected = false;
      input.disabled = true;
      sendBtn.disabled = true;
      statusText.textContent = 'Disconnected';
      addMessage(msg, 'system');
    });
  </script>
</body>
  </html>
